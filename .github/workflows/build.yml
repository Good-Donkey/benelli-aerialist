name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Stamp the version number
        shell: bash
        run: |
          # 1.0.0 shipped before this repo; build 2 here is 1.0.1, and each build after it counts up (1.0.2, ...).
          APP_VERSION="1.0.$(( ${{ github.run_number }} - 1 ))"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          printf 'VERSION = "%s"\nCOMMIT = "%s"\nDATE = "%s"\n' "$APP_VERSION" "${GITHUB_SHA::7}" "$(date -u '+%b %-d, %Y')" > aerialist/_build.py
          cat aerialist/_build.py

      - name: Build BenelliAerialist.exe
        # pymupdf.layout is an optional AI layout analyser we don't use; it breaks the frozen app and adds bulk.
        run: >-
          pyinstaller --noconfirm --windowed --name BenelliAerialist
          --icon installer/aerialist.ico --add-data "aerialist/assets;aerialist/assets" --add-data "LICENSE;." --add-data "THIRD-PARTY-NOTICES.md;."
          --exclude-module pymupdf.layout --exclude-module pymupdf4llm
          --exclude-module onnxruntime --exclude-module networkx
          run.py

      - name: Check the app starts
        run: |
          $p = Start-Process dist\BenelliAerialist\BenelliAerialist.exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error 'The app did not start and exit cleanly'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed with code $($p.ExitCode) (page did not render)"; exit 1 }

      - name: Zip (portable version)
        run: Compress-Archive -Path dist\BenelliAerialist -DestinationPath BenelliAerialist-windows.zip

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ env.APP_VERSION }} installer\aerialist.iss

      - name: Check the installer installs a working app
        run: |
          $i = Start-Process dist\BenelliAerialist-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($i.ExitCode -ne 0) { Write-Error "Installer failed with code $($i.ExitCode)"; exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\Benelli Aerialist\BenelliAerialist.exe"
          $p = Start-Process $exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error 'Installed app hung'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "Installed app self-test failed ($($p.ExitCode))"; exit 1 }

      # No build artifacts are uploaded: they count against the account's small Actions storage allowance,
      # and the release below already holds the same files (release files don't count).

      - name: Publish as the "latest" download
        if: github.ref == 'refs/heads/main'  # (a run on another branch just checks the build)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/BenelliAerialist-Setup.exe BenelliAerialist-windows.zip \
            --title "Benelli Aerialist ${{ env.APP_VERSION }}" \
            --notes "Version ${{ env.APP_VERSION }}, built from ${GITHUB_SHA::7}. Easiest: download and run BenelliAerialist-Setup.exe. Portable option: unzip BenelliAerialist-windows.zip and run BenelliAerialist.exe."
